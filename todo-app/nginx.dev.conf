# nginx.dev.conf:
# Development Nginx Reverse Proxy Configuration with front and backend routing.
# 'events' block is required by Nginx (even if empty), to configure connection processing.
events { }

http {
  server {
    # Nginx listens on port 80 inside its container (mapped to 8080 on our host machine).
    listen 80;

    # Requests starting with root (/) are handled and routed to the frontend container.
    location / {
      # Configure Nginx to support WebSocket connection, so that Vite hot reload will work through the proxy.
      # HTTP v1.1 required to support persistent connections and protocol upgrades.
      proxy_http_version 1.1;
      # Forward the 'Upgrade' header from the client to allow protocol switching (from HTTP to WebSocket).
      proxy_set_header Upgrade $http_upgrade;
      # Set the connection header to 'upgrade' to establish a live WebSocket tunnel for dynamic rerender.
      proxy_set_header Connection 'upgrade';
      
      # Route traffic to the frontend service container ('app' port :5173).
      proxy_pass http://app:5173;
    }

    # Requests starting with /api/ are handled and routed to the Express backend container
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      
      # Route traffic to the backend service container ('server' port :3000).
      # The trailing slash (/) ensures /api/todos is rewritten and forwarded as /todos to the backend
      proxy_pass http://server:3000/;
    }
  }
}