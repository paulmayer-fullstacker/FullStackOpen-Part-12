events { }

http {
  # Include standard MIME types mapping (e.g., text/css, application/javascript).
  # Required for production: Without this, Nginx serves static assets with a generic 'application/octet-stream' type,
  # causing the browser to security-block and refuse to execute React's compiled JavaScript and CSS files.
  include /etc/nginx/mime.types;

  server {
    listen 80;

    # Requests starting with root (/) are handled and routed to the front container.
    location / {
      # Route traffic to the todo-front service container ('app' port :80).
      proxy_pass http://app:80;
    }

    # Requests starting with /api/ are handled and routed to the Express backend container
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      
      # Forward requests to the 'server' service, stripping the /api prefix
      proxy_pass http://server:3000/;
    }
  }
}