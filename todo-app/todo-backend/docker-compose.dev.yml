# docker-compose.dev.yml:

services:
 # Defins a service (container) named "mongo".
  mongo:
  # Pull official MongoDB Docker image from Docker Hub.
    image: mongo
    # Map port 3456 on our host machine to port 27017 (MongoDB's default port) inside the container.
    ports:
      - 3456:27017
    # Define environment variables inside the container to configure the database.
    environment:
    # Set the root username for authentication.
      MONGO_INITDB_ROOT_USERNAME: root
      # Sets the root password for authentication.
      MONGO_INITDB_ROOT_PASSWORD: example
      # Set the name of the database ('the_database') that will be created when the container first starts.
      MONGO_INITDB_DATABASE: the_database
    volumes:
    # Mount local file (/mongo/mongo-init.js) into container's initialization directory (docker-entrypoint-initdb.d/mongo-init.js).
    - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    # Mount local directory (./mongo_data) to the container's database storage directory, for data persistence.
    - ./mongo_data:/data/db   # Requires insersion in .gitignore

  # Defines a service (container) named "redis".
  redis:
    # Pull official Redis Docker image from Docker Hub.
    image: redis
    # Map port 6379 on our host machine to port 6379 (Redis's default port) inside the container.
    ports:
      - 6379:6379
    # Mount local directory (./redis_data) to the container's data directory, for Redis data persistence.
    volumes:
      - ./redis_data:/data   # Requires definition within local .gitignore

